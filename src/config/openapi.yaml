
openapi: 3.0.0

info:
  title: Task Manager API
  version: 1.0.0
  description: |
    REST API for managing tasks and user accounts.
    Supports user registration, authentication, refresh tokens,
    and authenticated task management.

servers:
  - url: http://localhost:3000
    description: Development server

tags:
  - name: Health
    description: API health checks
  - name: Authentication
    description: Registration and authentication
  - name: Users
    description: User management
  - name: Tasks
    description: Task management

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserRegistration:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: SecurePassword123

    UserLogin:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: SecurePassword123

    Task:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Learn TypeScript
        completed:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
        userId:
          type: integer
          example: 1

    CreateTask:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          example: Learn Express

    UpdateTask:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          example: Learn advanced Express
        completed:
          type: boolean
          example: true

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Something went wrong

paths:

  /health:
    get:
      tags:
        - Health
      summary: Check API health
      responses:
        '200':
          description: API is running

  /api/v1/auth:
    get:
      tags:
        - Users
      summary: Get all users
      responses:
        '200':
          description: Users retrieved successfully
        '500':
          description: Internal server error

  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Invalid registration data
        '409':
          description: Email already exists

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Log in a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: Login successful. Returns access token and sets refresh cookie.
        '400':
          description: Invalid request
        '401':
          description: Invalid credentials

  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Uses the refresh-token cookie to issue a new access token and rotate the refresh token.
      responses:
        '200':
          description: Access token refreshed
        '401':
          description: Invalid, expired or revoked refresh token

  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out a user
      description: Revokes the refresh token and clears the refresh-token cookie.
      responses:
        '200':
          description: Logout successful
        '401':
          description: Unauthorized

  /api/v1/tasks:
    get:
      tags:
        - Tasks
      summary: Get authenticated user's tasks
      description: Retrieves tasks belonging only to the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Number of tasks per page
        - name: completed
          in: query
          schema:
            type: boolean
          description: Filter by completion status
        - name: sortBy
          in: query
          schema:
            type: string
            enum:
              - createdAt
              - title
            default: createdAt
          description: Field used to sort tasks
        - name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          description: Sorting direction
        - name: search
          in: query
          schema:
            type: string
          description: Case-insensitive search by task title
      responses:
        '200':
          description: Tasks retrieved successfully
        '400':
          description: Invalid query parameters
        '401':
          description: Unauthorized

    post:
      tags:
        - Tasks
      summary: Create a task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTask'
      responses:
        '201':
          description: Task created successfully
        '400':
          description: Invalid task data
        '401':
          description: Unauthorized

  /api/v1/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: Task ID

    get:
      tags:
        - Tasks
      summary: Get a task by ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Task retrieved successfully
        '400':
          description: Invalid task ID
        '401':
          description: Unauthorized
        '404':
          description: Task not found

    patch:
      tags:
        - Tasks
      summary: Update a task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTask'
      responses:
        '200':
          description: Task updated successfully
        '400':
          description: Invalid update data
        '401':
          description: Unauthorized
        '404':
          description: Task not found

    delete:
      tags:
        - Tasks
      summary: Delete a task
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Task deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Task not found
