
name: Task Manager API CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: task_mananger_owner
          POSTGRES_PASSWORD: npg_Nc4ZgLzk9yRB
          POSTGRES_DB: task_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d task_manager_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure test environment
        run: |
          cat > .env.test <<'EOF'
          DATABASE_URL_TEST=postgresql://task_mananger_owner:npg_Nc4ZgLzk9yRB@ep-falling-dream-belby5fw-pooler.c-9.us-east-2.aws.neon.tech/task_manager_test?sslmode=require&channel_binding=require
          JWT_SECRET=7B9/n+t9Q8st/thl150hLhLpHwy07p1zhCap+9mLLiU=
          PORT=3001
          EOF

      - name: Generate Prisma Client
        run: npx dotenv-cli -e .env.test -- npx prisma generate

      - name: Apply database migrations
        run: npx dotenv-cli -e .env.test -- npx prisma migrate deploy

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
